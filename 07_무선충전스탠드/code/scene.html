<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script src="three.min.js"></script></head><body><script>
const W=1600,H=1000;const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(W,H);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);THREE.Object3D.DefaultUp.set(0,0,1);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(30,W/H,1,10000);cam.up.set(0,0,1);
const hemi=new THREE.HemisphereLight(0xffffff,0x8a9399,0.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(300,-400,600);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-300,right:300,top:300,bottom:-300,near:10,far:2000});scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.45);fill.position.set(-300,400,300);scene.add(fill);
const M=(c,r=0.5,m=0.1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,side:THREE.DoubleSide});
const table=new THREE.Mesh(new THREE.BoxGeometry(700,500,10),M(0x6e5a44,0.75,0));table.position.set(0,0,-5);table.receiveShadow=true;scene.add(table);
// phone leaning on front surface (70 deg), bottom on ledge
const ANG=70*Math.PI/180; const ph=new THREE.Group();scene.add(ph);
const body=new THREE.Mesh(new THREE.BoxGeometry(75,8,160),M(0x2b2f36,0.35,0.5));body.castShadow=true;
const scr=new THREE.Mesh(new THREE.PlaneGeometry(70,154),new THREE.MeshStandardMaterial({color:0x0b2540,emissive:0x05182b,emissiveIntensity:0.4,roughness:0.2}));scr.rotation.x=Math.PI/2;scr.position.y=-4.1;
const pg=new THREE.Group();pg.add(body);pg.add(scr);body.position.z=80;scr.position.z=80;pg.rotation.x=(Math.PI/2-ANG);
pg.position.set(0,-40-4-3,12);ph.add(pg);
const dec=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Float32Array(u.buffer);};
const parts={};
fetch('meshes.json').then(r=>r.json()).then(J=>{for(const k in J){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(dec(J[k].pos),3));g.setAttribute('color',new THREE.BufferAttribute(dec(J[k].col),3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.55,metalness:0.05,flatShading:true,side:THREE.DoubleSide}));m.castShadow=true;m.receiveShadow=true;m.visible=false;scene.add(m);parts[k]=m;}window.ready=true;});
window.show=function(k,phone){for(const p in parts)parts[p].visible=(p===k);ph.visible=phone;};
window.view=function(p,t,fov){cam.fov=fov||30;cam.position.set(...p);cam.lookAt(...t);cam.updateProjectionMatrix();renderer.render(scene,cam);};
</script></body></html>
