<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormProof · 1차 설계</title>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/OrbitControls.js"></script>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#111827; --ink2:#4b5563; --ink3:#9aa3ae; --line:#e3e7ee; --soft:#f4f6f9;
  --nav:#172033; --blue:#2563eb; --blue-d:#1d4ed8; --blue-s:#e8efff; --green:#0f9f6e; --green-s:#e3f6ee;
  --red:#d33a4b; --red-s:#fdecee; --amber:#e8853a; --amber-s:#fff3e6; --dark:#141c2c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
/* 한 화면에 다 들어가게: 머리줄 + 4단, 페이지 스크롤 없음 */
.wrap{height:100vh;display:flex;flex-direction:column;padding:12px 16px;gap:12px}
header.top{background:var(--nav);color:#fff;border-radius:14px;padding:9px 16px;display:flex;align-items:center;gap:12px;flex:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:-.2px}
.steps{margin-left:auto;display:flex;gap:6px}
.step{border:1px solid #2c3850;background:#1f2a40;color:#c3cbd8;border-radius:999px;padding:4px 11px;font-size:14.5px;white-space:nowrap}
.step i{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border:1px solid currentColor;border-radius:50%;font-size:12.5px;margin-right:5px}
.step.done{color:#fff;border-color:#3b4a66}.step.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:clamp(340px,25vw,480px) minmax(0,1fr) clamp(340px,25vw,480px);gap:12px}
.grid>section{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:14px;border:1px solid #e6e9ef;padding:14px;min-height:0}
.card.fill{flex:1;display:flex;flex-direction:column;overflow:auto}
.card h2{font-size:17px;margin:0 0 10px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto}
.card h2 #vTitle,.card h2 #simTag{margin-left:0;background:var(--blue-s);color:var(--blue)}
.tag{font-size:13.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.green{background:var(--green-s);color:var(--green)}.tag.amber{background:var(--amber-s);color:#b8601d}.tag.blue{background:var(--blue-s);color:var(--blue)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;resize:none;outline:none}
textarea:focus{border-color:var(--blue)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 0;color:var(--ink2);font-weight:600;font-size:15px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pad{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;aspect-ratio:4/3;cursor:crosshair}
#sketchBox,#imageBox{margin-top:2px}
.pad .hint{position:absolute;left:8px;bottom:6px;font-size:13px;color:var(--ink3);pointer-events:none}
.pad .ico{position:absolute;top:6px;display:flex;gap:4px;right:6px}
.ico button{width:28px;height:28px;border:1px solid var(--line);background:rgba(255,255,255,.95);border-radius:8px;display:grid;place-items:center;padding:0;color:var(--ink2)}
.ico button:hover{border-color:var(--blue);color:var(--blue)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:15px;color:var(--ink)}
select.btn{width:100%;margin-top:8px}
.btn.primary{width:100%;border:0;background:var(--blue);color:#fff;font-weight:700;padding:12px;border-radius:11px;font-size:17px;margin-top:auto}
.btn.primary:hover{background:var(--blue-d)}.btn.primary:disabled{background:#9db5f0;cursor:wait}
.btn.opt{width:100%;border:0;background:var(--dark);color:#fff;font-weight:700;padding:12px;border-radius:11px;font-size:17px;margin-top:auto}
.btn.opt:disabled{background:#9aa3ae;cursor:default}
.drop{display:block;border:1.5px dashed #c9d1dd;border-radius:10px;padding:14px;text-align:center;color:var(--ink2);font-size:15px;background:var(--soft);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-s)}
.drop img{max-width:100%;border-radius:8px;display:block;margin:0 auto 6px}
.spacer{flex:1;min-height:10px}
.spec{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;max-height:38vh;overflow:auto}
.spec h3{font-size:15px;margin:0 0 6px;display:flex;align-items:baseline;gap:6px}.spec h3 small{font-weight:500;color:var(--ink3);font-size:13px}
.spec .g{font-size:13px;font-weight:700;color:var(--ink2);margin:7px 0 3px}
.spec .r{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.35;padding:2px 0}
.spec .r .t{flex:1;min-width:0}.spec .r .t q{color:var(--ink2);quotes:"\201C" "\201D"}.spec .r .t q+span:before{content:" → ";color:var(--ink3)}
.spec .r .s{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:42%}
.spec .s i{font-style:normal;font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 6px;white-space:nowrap}
.spec .s i.in{background:#e6f4fb;color:#0b6e99}.spec .s i.db{background:var(--blue-s);color:var(--blue-d)}.spec .s i.as,.spec .s i.qq{background:var(--soft);color:var(--ink2)}
.spec .r.q .t{color:var(--ink2)}

/* 가운데: 위 = 형상(메인), 아래 = 분포 창 3개. 캔버스 하나로 네 칸을 같은 카메라로 그림 */
.views{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.views>canvas{position:absolute;inset:0;z-index:1;pointer-events:none}
.vp{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(#f7f9fc,#e9edf3);border:1px solid var(--line)}
.vmain{flex:2.1;min-height:0}
.vrow{flex:1;min-height:0;display:flex;gap:10px}
.views h2.vsec{margin:2px 0 -2px;padding-top:10px;border-top:1px solid var(--line);flex:none}   /* 위 = 3D 설계 / 아래 = 물리 시뮬레이션 */
.vrow .vp{flex:1;min-width:0}
.vp>*{z-index:2}
.vp .ovl{position:absolute;left:10px;top:9px;background:rgba(255,255,255,.88);border-radius:8px;padding:3px 8px;font-size:14px;color:var(--ink2)}
.vp .vt{position:absolute;right:10px;top:9px;display:flex;gap:5px;z-index:4}
.vp .vt button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:8px;padding:3px 9px;font-size:14px}
.vp .vt button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.vp .lab{position:absolute;left:8px;top:7px;font-size:14px;font-weight:700;background:rgba(255,255,255,.88);border-radius:7px;padding:2px 7px}
.vp .leg{position:absolute;left:8px;right:8px;bottom:7px;font-size:13px;color:var(--ink2);background:rgba(255,255,255,.88);border-radius:7px;padding:3px 7px}
.vp .leg .bar{height:7px;border-radius:4px;margin:2px 0;background:linear-gradient(90deg,#30123b,#4662d7,#36aaf9,#1ae4b6,#72fe5e,#c8ef34,#faba39,#f66b19,#ca2a04,#7a0403)}
.vp .leg .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.vp .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:14.5px}
.vp>.draw{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;display:none;z-index:0}   /* 캔버스 아래 — 도면일 때 메인 칸을 비워 보이게 */
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink3);font-size:16px;pointer-events:none}
.busy{position:absolute;inset:0;background:rgba(247,249,252,.92);display:none;place-items:center;z-index:5}
.busy.on{display:grid}
.busy .box{text-align:center}.busy .spin{width:32px;height:32px;border:3px solid #cfd8e6;border-top-color:var(--blue);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy .stage{font-size:15px;color:var(--ink2)}.busy .stage b{color:var(--ink);font-weight:600}
.busy .hist{margin-top:8px;font-size:13.5px;color:var(--ink3);line-height:1.6;text-align:left;font-variant-numeric:tabular-nums}
/* 오른쪽 두 단 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--soft);border-radius:10px;padding:7px 10px}.kpi small{color:var(--ink2);font-size:13.5px;display:block}.kpi b{font-size:20px}
.metrics{display:flex;flex-direction:column;gap:7px}
.metric{display:block;width:100%;text-align:left;background:#f8f9fb;border:1px solid #eef0f4;border-radius:11px;padding:8px 10px;color:inherit;transition:background .12s,border-color .12s}
.metric:hover{background:#f2f5fa;border-color:#e2e7ef}
.metric.sel{background:#eef4ff;border-color:#b9cdf8;box-shadow:inset 3px 0 0 var(--blue)}
.metric .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}.metric .row b{font-size:16px;white-space:nowrap}
.metric .ck{display:inline-grid;place-items:center;width:15px;height:15px;border:1.5px solid #c9d1dd;border-radius:4px;margin-right:6px;vertical-align:-2px;font-size:12px;color:#fff;flex:none}
.metric.sel .ck{background:var(--blue);border-color:var(--blue)}
.metric .sub{display:flex;justify-content:space-between;color:var(--ink2);font-size:13.5px;margin-top:2px}
.pick{font-size:14px;color:var(--ink2);margin:0 0 8px}
.nopick .metric{cursor:default}.nopick .metric:hover{background:#f8f9fb;border-color:#eef0f4}.nopick .ck{display:none}
.metric .src{font-size:12.5px;color:var(--blue);margin-left:6px;font-weight:600;white-space:nowrap}
.metric .row>span{min-width:0}.metric .v0{color:var(--ink3);font-weight:500}.metric .v0 s{text-decoration:line-through}
.optinfo .ph{font-size:13px;font-weight:700;letter-spacing:.3px;opacity:.85;margin-bottom:2px}.optinfo canvas{display:block;width:100%;height:40px;margin:6px auto 0}
.optinfo{background:rgba(20,28,44,.94);color:#fff;border-radius:10px;padding:8px 12px;font-size:14.5px;text-align:center;margin:0 0 8px;flex:none}
.optinfo[hidden]{display:none}
.mbox{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.optinfo .pb{height:4px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:5px;overflow:hidden}.optinfo .pb i{display:block;height:100%;background:#5b9cff;width:0}
.optinfo.ok{background:rgba(15,159,110,.92)}.optinfo.bad{background:rgba(211,58,75,.92)}
#metrics{min-height:0;overflow:auto}
.drop img{max-height:min(34vh,420px)}
@media (max-height:820px){            /* 노트북 화면: 블록 · 요약 칸을 줄여 한 화면에 */
  .metric{padding:5px 9px}.metrics{gap:5px}.metric .bar{margin-top:3px;height:6px}.metric .sub{margin-top:1px;font-size:13px}
  .kpis{margin-bottom:8px}.kpi{padding:4px 9px}.kpi b{font-size:20px}.card{padding:12px}.card h2{margin-bottom:7px}.pick{margin-bottom:5px}
  .btn.primary,.btn.opt{padding:10px}.files a{padding:6px 4px}
}
.bar{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}.bar i.bad{background:var(--red)}
.metric.ref{opacity:.7}.metric.ref .bar i{background:var(--ink3)}
.cons{display:flex;flex-direction:column;gap:6px}
.con{background:var(--soft);border-radius:9px;padding:6px 10px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.con b{font-size:15px;font-weight:600}.con span{color:var(--ink2);text-align:right;white-space:nowrap}
.con.info span{white-space:normal;max-width:60%}
.con.req{background:var(--blue-s)}
.load{font-size:14px;color:var(--ink2);margin:-4px 0 10px}
.files{display:flex;gap:6px;margin:12px 0 8px}
.files a{flex:1;text-align:center;border:1px solid var(--line);border-radius:9px;padding:7px 4px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.files a:hover{border-color:var(--blue);color:var(--blue)}.files a.off{pointer-events:none;color:var(--ink3)}
.muted{color:var(--ink3);font-size:15px}
/* 설계 사양 표 (스케치 아래): 한 줄 = 한 항목 · 한 수치. 수치는 고쳐 쓸 수 있고(🔒 = 계산 조건 고정), 확정해야 1차 설계 */
.specw{flex:1;min-height:0;display:none;flex-direction:column;margin-top:10px;border:1px solid #e3e7ee;border-radius:10px;background:#fff;overflow:hidden}
.specw.on{display:flex}
.specw .sh{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;padding:6px 10px;background:#f4f6fa;border-bottom:1px solid #e3e7ee}
.specw .sh small{font-weight:600;color:var(--ink);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specw .sh .ok{color:var(--green)}
.specw .stale{font-size:13.5px;color:#b8601d;background:var(--amber-s);padding:4px 10px}
.specw .sc{flex:1;min-height:0;overflow:auto}
table.st{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.st th{position:sticky;top:0;z-index:1;background:#fafbfc;font-size:13px;color:var(--ink);font-weight:600;text-align:left;padding:4px 8px;border-bottom:1px solid #eef0f4}
table.st td{padding:3px 8px;border-bottom:1px solid #f2f4f7;vertical-align:middle;line-height:1.3}
table.st tr.g1 td{border-top:1px solid #e3e7ee}
table.st td.it{overflow:hidden}
table.st td.it .q{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.st td.it .q i{font-style:normal;font-size:11.5px;font-weight:700;border-radius:4px;padding:0 3px;margin-right:2px}
table.st .q i.t{background:var(--blue-s);color:var(--blue)}table.st .q i.s{background:#f1ebfb;color:#7146b8}table.st .q i.d{background:#eef0f4;color:var(--ink3)}
table.st td.v{white-space:nowrap;font-variant-numeric:tabular-nums}
table.st td.v .op{display:inline-block;width:12px;color:var(--ink2)}
table.st td.v input{width:64px;border:1px solid #d6dce5;border-radius:6px;padding:2px 5px;font:inherit;font-weight:700;text-align:right;background:#fff}
table.st td.v input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue-s)}
table.st tr.ed td.v input{background:#fff6dd;border-color:#ebb64e}
table.st td.v .lk{display:inline-block;min-width:64px;text-align:right;font-weight:700;color:var(--ink2);padding:0 6px}
table.st td.v .lk:after{content:"🔒";font-size:11px;margin-left:3px;opacity:.55}
table.st td.v .tx{display:block;white-space:normal;color:var(--ink);font-size:14px}
table.st td.v small{color:var(--ink);margin-left:3px;font-size:inherit}
table.st td.b em{font-style:normal;font-size:12px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap}
table.st em.k0{background:var(--green-s);color:var(--green)}table.st em.k1{background:#f1ebfb;color:#7146b8}table.st em.k2{background:var(--blue-s);color:var(--blue)}
table.st em.k3{background:var(--amber-s);color:#b8601d}table.st em.k4{background:#fde8ea;color:var(--red)}
table.st tbody tr{opacity:0;transition:opacity .25s}table.st tbody tr.in{opacity:1}
.has-spec .pad canvas{width:auto;height:min(24vh,280px);margin:0 auto}
@media (max-height:820px){.has-spec .pad canvas{height:19vh}}
.acts{display:flex;gap:6px;margin-top:10px;flex:none}
.acts .btn{flex:1;width:auto;margin:0;padding:11px 4px;border-radius:11px;font-weight:700;font-size:15.5px;border:0;color:#fff;white-space:nowrap}
.acts #bSpec{background:var(--blue)}.acts #bConfirm{background:var(--green)}.acts #go{background:var(--dark)}
.acts .btn:disabled{background:#c5ccd6 !important;cursor:default}
.acts .btn.done{background:#e8edf3 !important;color:var(--ink2)}
.vt[hidden]{display:none}
header .brand-r{height:17px;width:auto;display:block;margin-left:14px}   /* 2/3 크기: 대문자 높이 ≈ 왼쪽 FormProof(17px 굵게)와 같음 */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1720;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;display:none;z-index:20;max-width:80vw}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg></div>
    <div class="brand"><b>FormProof</b></div>
    <nav class="steps" id="steps"><span class="step on"><i>1</i>입력</span><span class="step"><i>2</i>설계 사양</span><span class="step"><i>3</i>1차 설계</span><span class="step"><i>4</i>물리 최적화</span></nav>
    <img class="brand-r" src="/static/brand/samsung_research.png" alt="Samsung Research">
  </header>

  <div class="grid">
    <!-- 1. 입력 -->
    <section>
      <div class="card fill">
        <h2>입력</h2>
        <textarea id="text" placeholder="만들 제품과 원하는 조건을 적어 주세요 (예: 27인치 TV 스탠드, 아이가 밀어도 안 넘어지게)" style="min-height:100px;overflow:hidden;flex:none"></textarea>
        <div class="seg" style="margin-top:10px"><button id="mSketch" class="on">스케치</button><button id="mImage">사진</button></div>
        <div id="sketchBox">
          <div class="pad"><canvas id="pad" width="800" height="600"></canvas>
            <span class="hint" id="padHint">여기에 모양을 그려 주세요</span>
            <div class="ico">
              <button id="undo" title="되돌리기" aria-label="되돌리기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
              <button id="clear" title="지우기" aria-label="지우기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
            </div></div>
          <select class="btn" id="example"><option value="">예시 고르기</option></select>
        </div>
        <div id="imageBox" style="display:none">
          <label class="drop" id="drop"><div id="dropInner">사진을 끌어 놓거나 눌러서 선택</div>
            <input type="file" id="file" accept="image/*" hidden></label>
          <select class="btn" id="photoEx"><option value="">예시 사진…</option></select>
        </div>
        <div class="specw" id="specs"><div class="sh">설계 사양 <small id="specInfo"></small></div><div class="stale" id="specStale" hidden></div>
          <div class="sc"><table class="st"><colgroup><col style="width:45%"><col style="width:37%"><col style="width:18%"></colgroup>
            <thead><tr><th>항목</th><th>사양</th><th>근거</th></tr></thead><tbody id="specBody"></tbody></table></div></div>
        <div class="spacer" id="padSpacer"></div>
        <div class="acts"><button class="btn" id="bSpec">설계 사양</button><button class="btn" id="bConfirm" disabled>확정</button><button class="btn" id="go" disabled>1차 설계 만들기</button></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const S = {mode:'sketch', strokes:[], cur:null, bgImg:null, image:null, last:null, rep:null};
const toast = m => {const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4200);};
function setStep(n){$$('#steps .step').forEach((e,i)=>{e.classList.toggle('on',i===n);e.classList.toggle('done',i<n);});}

/* ---------- 쉬운 말 (화면 표시용) ---------- */
const EASY=[
  [/^1차 고유진동수.*$/,'떨림 주파수'],[/^폰 온도 상승.*$/,'폰 온도 상승'],[/^화면 5 N 터치 처짐.*$/,'화면 누를 때 휨'],
  [/^충격 최대 응력.*$/,'충격 때 걸리는 힘'],[/^충격 층간 응력.*$|^층간 인장 응력.*$/,'출력 층이 벌어지는 힘'],
  [/^최대 흔들림.*$|^자갈길 흔들림.*$/,'흔들림'],[/^최소 부재 두께.*$/,'가장 얇은 곳 두께'],
  [/^넘어짐 각.*$/,'기울여도 안 넘어지는 각도'],[/^힘 시험: 수평력.*$/,'옆으로 밀 때 여유 (참고)'],[/^힘 시험: 하향력.*$/,'위에서 누를 때 여유 (참고)'],
  [/^최대 응력 \(화면.*$/,'몸체에 걸리는 힘'],[/^화면 윗단 흔들림.*$/,'밀 때 화면 흔들림'],[/^바퀴 하나 (최대 )?하중.*$/,'바퀴 하나가 받는 힘'],
  [/^총무게.*$|^무게$/,'총무게'],[/^착용 클램프 힘.*흘러내림.*$/,'머리 조이는 힘 (최소)'],[/^착용 클램프 힘.*편안.*$/,'머리 조이는 힘 (최대)'],
  [/^착용 클램프 힘.*$/,'조이는 힘'],[/^착용 벌림 최대 응력.*$/,'테에 걸리는 힘 (쓸 때)'],[/^브리지 누름.*$/,'테에 걸리는 힘 (코 부분 누를 때)'],
  [/^다리 표면 온도.*$|^피부 접촉 온도.*$/,'관자놀이 닿는 곳 온도'],[/^안정성 ① 기울임.*$/,'기울여도 안 넘어짐'],[/^안정성 ③ 힘 시험.*$/,'밀어도 안 넘어짐'],
  [/^응력$/,'몸체에 걸리는 힘'],[/^제품 전체 무게.*$/,'제품 전체 무게'],[/^화면 무게$/,'화면 무게'],[/^바퀴 하나 하중$/,'바퀴 하나가 받는 힘'],
  [/^내장 부품$/,'내장 부품'],[/^이동$/,'이동'],[/^낙하$/,'떨어뜨림']];
const easy = n => {for(const [re,t] of EASY) if(re.test(n)) return t; return n.replace(/\s*\((FEM|정역학)\)/g,'').replace(/응력/g,'힘').replace(/변위/g,'휨');};
// 분포 창 이름 (짧고 쉽게)
const FIELD={stress:'응력',shake:'흔들림',temp:'온도',disp:'휘는 정도',mode1:'떨림 모양',
  clamp_stress:'쓸 때 응력',clamp_disp:'쓸 때 벌어짐',bridge_stress:'코 부분 누를 때 응력',bridge_disp:'코 부분 누를 때 휨'};
const FIELD_PRI=['stress','shake','temp','clamp_stress','bridge_stress','clamp_disp','disp','bridge_disp','mode1'];
const noPres = s => String(s||'').replace(/\s*\(발표[^)]*\)/g,'').replace(/\s*[—·-]?\s*발표\s*\d+[^,·)]*쪽[^,·)]*/g,'').trim();

/* ---------- 스케치 ---------- */
const pad = $('#pad'), ctx = pad.getContext('2d');
function redraw(){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,pad.width,pad.height);
  if(S.bgImg){const r=Math.min(pad.width/S.bgImg.width,pad.height/S.bgImg.height)*0.92, w=S.bgImg.width*r, h=S.bgImg.height*r;
    ctx.drawImage(S.bgImg,(pad.width-w)/2,(pad.height-h)/2,w,h);}
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of S.strokes){ctx.strokeStyle=s.c||'#111';ctx.lineWidth=s.w||4;ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(s.length===1)ctx.lineTo(s[0][0]+0.1,s[0][1]);ctx.stroke();}
  $('#padHint').hidden=S.strokes.length>0||S.labels.length>0||!!S.bgImg;
  for(const L of S.labels){ctx.fillStyle=L.c||'#111';ctx.font=`700 ${L.s}px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR",sans-serif`;ctx.textBaseline='alphabetic';ctx.fillText(L.t,L.x,L.y);}
}
S.labels=[];
const pt = e => {const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height];};
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);S.cur=[pt(e)];S.strokes.push(S.cur);redraw();inputChanged();});
pad.addEventListener('pointermove',e=>{if(!S.cur)return;const p=pt(e),q=S.cur[S.cur.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])>1.5){S.cur.push(p);redraw();}});
['pointerup','pointercancel','pointerleave'].forEach(n=>pad.addEventListener(n,()=>{S.cur=null;}));
$('#undo').onclick=()=>{if(S.labels.length&&(!S.strokes.length||S.labelsLast))S.labels.pop();else if(S.strokes.length)S.strokes.pop();else S.bgImg=null;redraw();inputChanged();};
$('#clear').onclick=()=>{S.strokes=[];S.labels=[];S.bgImg=null;$('#example').value='';redraw();inputChanged();};
S.demos=[];
// 예시 = 제품 셋 (말 + 스케치 — 지금 1차 설계 형상을 그대로 냄). 고르면 말과 스케치 획이 채워짐
function fillExamples(){const sel=$('#example');sel.innerHTML='<option value="">예시 고르기</option>';
  S.demos.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.label;sel.appendChild(o);});}
function loadDemo(i){const d=S.demos[i];if(!d)return;$('#mSketch').onclick();$('#text').value=d.prompt;
  S.bgImg=null;S.strokes=d.sketch.strokes.map(s=>Object.assign(s.p.map(q=>q.slice()),{c:s.c,w:s.w}));S.labels=d.sketch.labels.map(L=>({...L}));S.labelsLast=true;redraw();inputChanged();}
fetch('/api/demos').then(r=>r.ok?r.json():[]).catch(()=>[]).then(demos=>{S.demos=demos;fillExamples();});
fetch('/api/photos').then(r=>r.json()).then(list=>list.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=decodeURIComponent(u.split('/').pop()).replace(/\.\w+$/,'').replace(/_/g,' ');$('#photoEx').appendChild(o);}));
$('#photoEx').onchange=async e=>{if(!e.target.value)return;const b=await (await fetch(e.target.value)).blob();loadFile(new File([b],decodeURIComponent(e.target.value.split('/').pop()),{type:b.type}));};
$('#example').onchange=e=>{if(e.target.value!=='')loadDemo(+e.target.value);};
redraw();
const hasSketch = () => S.strokes.length>0 || S.labels.length>0 || !!S.bgImg;

$('#mSketch').onclick=()=>{S.mode='sketch';$('#mSketch').classList.add('on');$('#mImage').classList.remove('on');$('#sketchBox').style.display='';$('#imageBox').style.display='none';};
$('#mImage').onclick=()=>{S.mode='image';$('#mImage').classList.add('on');$('#mSketch').classList.remove('on');$('#imageBox').style.display='';$('#sketchBox').style.display='none';};
function loadFile(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{S.image=rd.result;$('#dropInner').innerHTML=`<img src="${S.image}">`;inputChanged();};rd.readAsDataURL(f);}
$('#file').onchange=e=>loadFile(e.target.files[0]);
const drop=$('#drop');['dragover','dragenter'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

/* ---------- 3D: 캔버스 하나, 메인 + 분포 창 3개를 같은 카메라로 (메인에서 돌리면 아래 창도 똑같이) ---------- */
const V3 = {};
const SMALL=['#vS0','#vS1','#vS2'];
function init3d(){
  const host=$('#views');
  THREE.Object3D.DefaultUp.set(0,0,1);
  const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  R.setPixelRatio(Math.min(window.devicePixelRatio,2)); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.outputEncoding=THREE.sRGBEncoding; R.setClearColor(0x000000,0); R.setScissorTest(true); host.prepend(R.domElement);
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(25,1,5,20000); cam.up.set(0,0,1);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a9399,0.75));
  const sun=new THREE.DirectionalLight(0xffffff,1.15);sun.position.set(400,700,2600);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-1600,right:1600,top:1600,bottom:-1600,near:100,far:6000});sun.shadow.bias=-0.0005;scene.add(sun);
  const fill=new THREE.DirectionalLight(0xdfe9ff,0.35);fill.position.set(-1200,900,600);scene.add(fill);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.ShadowMaterial({opacity:0.18}));ground.position.z=-903;ground.receiveShadow=true;scene.add(ground);
  const M=(c,r=0.5,m=0.1)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
  const frameMat=M(0x1f2a33,0.35,0.35), darkMat=M(0x15191d,0.8,0), alMat=M(0x9aa3ab,0.3,0.8), tireMat=M(0x202326,0.9,0);
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function tube(a,b,r,mat,seg=24){const d=new THREE.Vector3().subVectors(b,a);const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),seg),mat);
    m.position.copy(a).addScaledVector(d,0.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;return m;}
  const bike=new THREE.Group();scene.add(bike);
  const S0=V(-90,0,-40), dH=V(0.309,0,-0.951), Hb=S0.clone().addScaledVector(dH,150), A=V(125,0,-563), Rr=V(-875,0,-563), BB=V(-455,0,-633), ST=V(-607,0,-136), SAD=V(-650,0,-40);
  const TT=S0.clone().addScaledVector(dH,25);
  [[ST,TT,16],[BB,Hb,20],[BB,ST,16],[S0,Hb,19]].forEach(p=>bike.add(tube(p[0],p[1],p[2],frameMat)));
  for(const s of [-38,38]){bike.add(tube(V(BB.x,s*0.6,BB.z),V(Rr.x,s,Rr.z),9,frameMat));bike.add(tube(V(ST.x,s*0.4,ST.z-20),V(Rr.x,s,Rr.z),8,frameMat));bike.add(tube(V(Hb.x,s*0.8,Hb.z),V(A.x,s*1.2,A.z),11,frameMat));}
  bike.add(tube(ST,SAD,13,alMat));
  const saddle=new THREE.Mesh(new THREE.BoxGeometry(260,70,40),darkMat);saddle.position.set(SAD.x-10,0,SAD.z+18);saddle.castShadow=true;bike.add(saddle);
  bike.add(tube(S0,V(0,0,0),17,frameMat));bike.add(tube(V(0,-30,0),V(0,30,0),22,frameMat));
  bike.add(tube(V(0,-360,0),V(0,-230,0),17.5,darkMat));bike.add(tube(V(0,230,0),V(0,360,0),17.5,darkMat));
  for(const s of [-1,1])bike.add(tube(V(0,s*215,0),V(70,s*235,-40),7,darkMat));
  function wheel(c){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.TorusGeometry(326,15,20,120),tireMat);t.rotation.x=Math.PI/2;t.castShadow=true;g.add(t);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(305,8,12,120),alMat);rim.rotation.x=Math.PI/2;g.add(rim);g.add(tube(V(0,-35,0),V(0,35,0),18,alMat));
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2,s=i%2?35:-35;g.add(tube(V(0,s,0),V(300*Math.cos(a),0,300*Math.sin(a)),1.2,alMat,6));}g.position.copy(c);return g;}
  bike.add(wheel(A));bike.add(wheel(Rr));
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(95,95,6,48),alMat);ring.position.set(BB.x,-60,BB.z);bike.add(ring);
  bike.add(tube(V(BB.x,-66,BB.z),V(BB.x+60,-70,BB.z-160),9,alMat));bike.add(tube(V(BB.x,66,BB.z),V(BB.x-60,70,BB.z+160),9,alMat));
  const handlebar=new THREE.Group();scene.add(handlebar);V3.handlebar=handlebar;
  handlebar.add(tube(V(0,-360,0),V(0,360,0),15.9,alMat,48));
  const ctl=new THREE.OrbitControls(cam,$('#vMain'));ctl.enableDamping=true;ctl.dampingFactor=0.12;   // 메인 창에서만 조작
  const cam2=new THREE.PerspectiveCamera(25,1,5,20000);
  Object.assign(V3,{R,scene,cam,cam2,k:1,mc:null,box:null,ctl,bike,ground,M,host,mount:null,holder:null,aux:[],small:SMALL.map(()=>({key:null,mat:null}))});
  const fit=()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.setSize(w,h,false);R.domElement.style.width=w+'px';R.domElement.style.height=h+'px';if(V3.box)fitSmall();};
  new ResizeObserver(fit).observe(host);fit();
  // 처음 화면은 비워 둠: 자전거 · 바닥 · 핸들바와 보기 버튼은 1차 설계 결과가 오면 (자전거 폰 거치대일 때만 자전거)
  bike.visible=ground.visible=handlebar.visible=false;$('#vMain .vt').hidden=true;
  view('full');
  (function loop(){requestAnimationFrame(loop);ctl.update();renderAll();})();
}
function rectIn(el){const a=el.getBoundingClientRect(),b=V3.host.getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height,H:b.height};}
function drawInto(el,cam=V3.cam){
  const {R,scene}=V3,r=rectIn(el);if(r.w<2||r.h<2)return false;
  const y=r.H-r.y-r.h;R.setViewport(r.x,y,r.w,r.h);R.setScissor(r.x,y,r.w,r.h);
  cam.aspect=r.w/r.h;cam.updateProjectionMatrix();R.render(scene,cam);return true;
}
function renderAll(){
  const {R}=V3;R.setScissor(0,0,V3.host.clientWidth,V3.host.clientHeight);R.clear();
  // 메인: 형상
  if(V3.mount)V3.mount.material=V3.baseMat;
  R.shadowMap.needsUpdate=true;
  if(!V3.drawing)drawInto($("#vMain"));   // 도면일 때는 메인 칸을 투명하게 두어 캔버스 아래 도면이 보임 (캔버스를 다른 요소로 덮지 않음)
  if(!V3.mount)return;
  // 분포 창: 부품만, 같은 카메라
  const vis=[V3.bike,V3.ground,V3.handlebar,V3.holder,...V3.aux].filter(Boolean).map(o=>[o,o.visible]);
  vis.forEach(([o])=>o.visible=false);R.shadowMap.autoUpdate=false;
  // 분포 창 카메라: 메인과 같은 방향 · 같은 거리(회전 · 확대가 그대로 따라감), 부품 중심을 보고, 처음에 부품이 꽉 차게(V3.k)
  const {cam,ctl,cam2}=V3, d=cam.position.distanceTo(ctl.target), fwd=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  cam2.quaternion.copy(cam.quaternion);cam2.position.copy(V3.mc).addScaledVector(fwd,-d);
  cam2.position.addScaledVector(new THREE.Vector3(0,1,0).applyQuaternion(cam.quaternion),-0.06*2*d*Math.tan(cam.fov*Math.PI/360)*V3.k);  // 색 막대 몫만큼 부품을 살짝 위로
  cam2.fov=2*Math.atan(Math.tan(cam.fov*Math.PI/360)*V3.k)*180/Math.PI;
  V3.small.forEach((s,i)=>{if(!s.mat)return;V3.mount.material=s.mat;drawInto($(SMALL[i]),cam2);});
  V3.mount.material=V3.baseMat;R.shadowMap.autoUpdate=true;vis.forEach(([o,v])=>o.visible=v);
}
function view(kind){

  return `<button class="metric${m.ref?' ref':''}${S.sel&&S.sel.has(i)?' sel':''}" data-i="${i}" title="${noPres(m.source||'')}"><div class="row"><span><i class="ck">✓</i>${m.label}${m.src?`<span class="src">${m.src}</span>`:''}</span><b style="color:${m.ref?'var(--ink2)':m.ok?'var(--green)':'var(--red)'}">${v} ${m.unit}</b></div>
    <div class="bar"><i class="${m.ok?'':'bad'}" style="width:${Math.max(Math.min(ratio,1)*100,3)}%"></i></div>
    <div class="sub"><span>목표 ${ge?'≥':'≤'} ${m.limit} ${m.unit}${v0}</span><span>${m.ref?'참고':m.ok?'충족':'미충족'}</span></div></button>`;
}
// 1차 설계 성능 항목 = 연한 블록. P01 은 눌러서 최적화 대상으로 고름(다시 누르면 해제) → 1개 이상이면 최적화 실행 버튼 켜짐.
// 다른 제품(TV 스탠드 · AI 글래스 · 템플릿 거치대)은 1차 설계까지만 → 고르기 · 실행 버튼 없음
function showMetrics(rows,pick){
  rows.forEach(m=>{if(typeof m.value==='number')m.v0=m.value;});
  S.rows=rows;S.sel=new Set();S.pick=!!pick;
  drawMetrics();
  $('#metrics').classList.toggle('nopick',!S.pick);$('#pickHint').hidden=!S.pick||!rows.length;$('#optimize').hidden=!S.pick;
  updateOpt();
}
function drawMetrics(){
  $('#metrics').innerHTML=S.rows.map(metricHtml).join('');
  const sh=S.rows.filter(m=>!m.ref);$('#kTime').textContent=sh.length?`${sh.filter(m=>m.ok).length} / ${sh.length}`:'–';
  $$('#metrics .metric').forEach(b=>b.onclick=()=>{if(!S.pick||S.opt)return;const i=+b.dataset.i;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);b.classList.toggle('sel',S.sel.has(i));updateOpt();});
}
function updateOpt(){
  const n=S.sel?S.sel.size:0,b=$('#optimize');
  b.disabled=!n||!S.rep||!!S.opt;b.textContent=S.opt?'최적화 중…':n?`물리 기반 최적화 실행 (${n}개)`:'물리 기반 최적화 실행';
}
// ---------- 물리 기반 최적화 (P01): 서버가 역설계 프레임(형상 · 예측값 · 분포)을 보내면 차례로 재생
function q16mesh(m){
  const b=atob(m.q16),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const q=new Int16Array(u.buffer),p=new Float32Array(q.length);
  for(let i=0;i<q.length;i++){const a=i%3;p[i]=(q[i]+32768)*m.sc[a]+m.lo[a];}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.computeVertexNormals();return g;
}
async function applyHeat(heat){
  if(!heat)return;
  await Promise.all(Object.values(heat.fields).map(decodeField));
  V3.small.forEach((s,i)=>{const f=s.key&&heat.fields[s.key];if(!f)return;
    if(s.mat){s.mat.userData.tex.dispose();s.mat.dispose();}
    s.mat=heatMaterial(heat,s.key);
    const leg=$(SMALL[i]).querySelector('.leg b');if(leg)leg.textContent=`${f.max}${f.unit?' '+f.unit:''}`;});
}
function applyFrame(f){
  if(f.mesh){const g=q16mesh(f.mesh);V3.mount.geometry.dispose();V3.mount.geometry=g;
    const bb=new THREE.Box3().setFromObject(V3.mount);if(!V3.optBox||!V3.optBox.containsBox(bb)){V3.optBox=(V3.optBox||bb.clone()).union(bb);V3.box=V3.optBox.clone();V3.mc=V3.box.getCenter(new THREE.Vector3());fitSmall();}}
  if(f.heat)applyHeat(f.heat);
  S.rows.forEach(m=>{if(!m.key||f.pred[m.key]==null)return;m.value=f.pred[m.key];m.ok=m.op==='>='?m.value>=m.limit:m.value<=m.limit;m.src='AI 예측';});
  drawMetrics();
  const nf=S.rows.filter(m=>!m.ok&&!m.ref).length;
  $('#perfTag').className='tag '+(nf?'amber':'green');$('#perfTag').textContent=`최적화 중 · ${nf?'미충족 '+nf+'개':'예측 충족'}`;
  $('#kMass').textContent=`${fmt(f.mass_g)} g`;
  $('#optText').textContent=`${f.it} / ${f.iters} 단계 · 무게 ${fmt(f.mass_g)} g`;
  $('#optBar').style.width=`${100*f.it/f.iters}%`;
  if(S.opt&&S.opt.hist){S.opt.hist.push({m:f.mass_g,p:f.pen});spark();}
}
// 반복마다 무게(흰 선) · 기준 벌점(주황 선) — 형상이 바뀌며 둘 다 내려가는 것이 보이게
function spark(){const c=$('#optSpark');if(!c)return;const g=c.getContext('2d'),W=c.width,H=c.height,h=(S.opt&&S.opt.hist)||[];g.clearRect(0,0,W,H);
  if(h.length<2)return;const line=(k,col)=>{const v=h.map(x=>x[k]),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;g.beginPath();
    v.forEach((y,i)=>{const X=i/(h.length-1)*(W-8)+4,Y=H-6-(y-lo)/r*(H-12);i?g.lineTo(X,Y):g.moveTo(X,Y);});g.strokeStyle=col;g.lineWidth=3;g.stroke();};
  line('p','#ffb36b');line('m','#ffffff');}
function finishOpt(r){
  const g=r.gate;
  $('#optPhase').textContent='② 찾은 형태를 정밀 계산으로 확인';setPhase('최적 설계','정밀 계산');$('#pTitle').textContent='성능 · 1차 → 최적';
  g.rows.forEach(x=>{const m=S.rows.find(m=>m.key===x.key);if(m){m.value=x.value;m.ok=x.ok;m.src='정밀 계산';}});
  drawMetrics();applyHeat(g.heat);
  $('#kMass').textContent=`${fmt(g.mass_g)} g`;
  const nf=S.rows.filter(m=>!m.ref&&!m.ok).length;
  $('#perfTag').className='tag '+(nf?'amber':'green');$('#perfTag').textContent=nf?`최적 설계 · 미충족 ${nf}개`:'최적 설계 · 목표 모두 충족';
  const box=$('#optInfo');box.classList.add(nf?'bad':'ok');
  $('#optText').textContent=`최적 설계 완료 · 무게 ${fmt(S.opt.m0)} → ${fmt(g.mass_g)} g · ${nf?'미충족 '+nf+'개':'목표 모두 충족'}`;
  $('#optBar').style.width='100%';
  const a=$('#fOpt');a.hidden=false;a.textContent='최적 설계 파일';a.href=r.files['opt_final.stl']+'?dl=1';
  setStep(3);
}
// TV 스탠드 · AI 글래스 · 템플릿 거치대: 고르기까지는 같고, 최적 설계는 아직 없음 → 고른 기준을 최적화 입력 묶음으로 저장
async function saveTargets(run,targets){
  const box=$('#optInfo');box.hidden=false;box.classList.remove('ok','bad');$('#optBar').style.width='0';
  try{
    const r=await fetch('/api/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run,targets})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);
    box.classList.add('ok');$('#optBar').style.width='100%';
    $('#optText').textContent=`이 제품의 최적 설계는 준비 중입니다 — 고른 ${targets.length}개 항목을 요청 파일로 저장했습니다`;
    const a=$('#fOpt');a.hidden=false;a.textContent='최적화 요청 파일';a.href=j.files['optimize_input.zip']+'?dl=1';
  }catch(e){toast(e.message);box.hidden=true;}
}
$('#optimize').onclick=async()=>{
  const rep=S.rep;if(!rep||!S.sel.size||S.opt)return;
  const run=(rep.files['handoff.zip']||'').split('/')[2];
  const targets=[...S.sel].sort((a,b)=>a-b).map(i=>S.rows[i].key).filter(Boolean);
  if(rep.template.id!=='P01')return saveTargets(run,targets);
  S.opt={n:0,queue:[],done:false,res:null,m0:null};updateOpt();updateActs();
  const box=$('#optInfo');box.hidden=false;box.classList.remove('ok','bad');$('#optText').textContent='역설계 준비 (형상 AI · 물리 AI)';$('#optBar').style.width='0';
  S.opt.hist=[];spark();$('#optPhase').textContent='① AI가 형태를 바꿔 가며 더 좋은 설계를 찾는 중';setPhase('AI가 찾는 중','AI 예측');$('#pTitle').textContent='성능 · AI 예측';setStep(3);
  V3.optBox=null;
  if(V3.kind!=='close')view('close');
  try{
    const r=await fetch('/api/optimize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run,targets})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);
    // 재생: 0.14 s 마다 한 프레임 (미리 계산한 경로도 형상이 바뀌는 것이 보이게)
    const play=new Promise(res=>{const h=setInterval(()=>{const o=S.opt;
      if(o.queue.length){const f=o.queue.shift();if(o.m0==null)o.m0=f.mass_g;applyFrame(f);}
      else if(o.done){clearInterval(h);res();}},140);});
    while(!S.opt.done){
      await new Promise(res=>setTimeout(res,300));
      const rq=await fetch(`/api/job?id=${encodeURIComponent(j.job)}&since=${S.opt.n}`),q=await rq.json();
      if(!rq.ok)throw new Error(STALE+(q.error?` (${q.error})`:''));
      if(q.error)throw new Error(q.error);
      if(q.frames){S.opt.queue.push(...q.frames);S.opt.n+=q.frames.length;}
      if(!q.frames||!q.frames.length)$('#optText').textContent=q.stage+(q.detail?' · '+q.detail:'');
      if(q.done){S.opt.res=q.result;S.opt.done=true;}
    }
    await play;
    finishOpt(S.opt.res);
  }catch(e){toast(e.message);$('#optInfo').hidden=true;}
  finally{S.opt=null;updateOpt();updateActs();}
};
function setCommon(rep, massG){
  const t=rep.template;
  setPhase('1차 설계','1차 설계');$('#pTitle').textContent='1차 설계 성능';
  $('#tplTag').className='tag blue';$('#tplTag').textContent=noPres(t.name).replace(/\s*\([^)]*\)/g,'').replace(/\s*—\s*/,' · ');
  $('#imgDraw').src=rep.files['design_1st_drawing.png']||'';
  $('#kMass').textContent=massG>=1000?`${fmt(massG/1000,2)} kg`:`${fmt(massG)} g`;
  $$('#files a[data-f]').forEach(a=>{const f=rep.files[a.dataset.f];a.classList.toggle('off',!f);if(f)a.href=f+'?dl=1';});
  $('#fOpt').hidden=true;$('#optInfo').hidden=true;
}
// 가운데 칸 머리: 3D 설계 · 물리 시뮬레이션 옆에 지금 단계
function setPhase(a,b){$('#vTitle').textContent=a;$('#simTag').textContent=b;$('#vTitle').hidden=$('#simTag').hidden=false;}
function setPerfTag(){const n=S.rows.filter(m=>!m.ref).length,nf=S.rows.filter(m=>!m.ref&&!m.ok).length;
  $('#perfTag').className='tag '+(nf?'amber':'green');$('#perfTag').textContent=nf?`미충족 ${nf}개`:'목표 모두 충족';}
const HIDE=new Set(['interlayer']);      // 비전문가에게 어려운 항목 (판정 · 최적화 계산에는 그대로 씀)
const judgeRows=j=>j.rows.filter(r=>!HIDE.has(r.key)&&!r.ref).map(r=>({key:r.key,name:r.name,label:easy(r.name),value:r.value,unit:r.unit,op:r.op,limit:r.limit,ok:r.ok,ref:!!r.ref,source:r.source}));
function renderIntegral(rep){          // P01 (일체형 거치대)
  const j=rep.judge;
  showMount(rep);
  setCommon(rep, rep.cad.print_total_g||rep.cad.mass_g);
  showMetrics(judgeRows(j),true);              // 학습 모델(역설계)은 P01 에만
  setPerfTag();
}
function renderProduct(rep){          // TV 스탠드 · AI 글래스
  const j=rep.judge;
  showProduct(rep);
  setCommon(rep, rep.cad.mass_g);
  showMetrics(judgeRows(j),true);            // 고르기는 P01 과 같음 (최적 설계는 아직 P01 만)
  setPerfTag();
}
function renderTemplate(rep){         // 자전거 거치대 템플릿 (T01 …)
  const c=rep.first_design_check, ck=c.checks, rows=[], lim=x=>+x.limit.split(' ')[1];
  showMount(rep);
  setCommon(rep, rep.cad.mass_g);
  const add=(key,label,d,unit,op)=>{const x=ck[key];if(x)rows.push({key,name:key,label,value:+x.value.toFixed(d),unit,op,limit:lim(x),ok:x.pass,ref:!!x.reference,source:x.limit});};
  add('transmissibility','흔들림',2,'배','<=');add('f1','떨림 주파수',1,'Hz','>=');add('stress','충격 때 걸리는 힘',1,'MPa','<=');
  showMetrics(rows,true);
  setPerfTag();
}
function renderSpec(rows){            // 설계 사양 카드 — 어떤 제품 · 입력이든 같은 형식 (formproof_input/spec_view.py)
  const box=$('#specBox');if(!rows||!rows.length){box.hidden=true;return;}
  const cls={'입력':'in','근거 DB':'db','가정':'as','질문':'qq'}, esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let h='',g='';
  rows.forEach(r=>{if(r.group!==g){g=r.group;h+=`<div class="g">${esc(g)}</div>`;}
    h+=`<div class="r${g==='질문'?' q':''}"><div class="t">${r.said?`<q>${esc(r.said)}</q>`:''}<span>${esc(r.cond)}</span></div><div class="s">${r.src.map(x=>`<i class="${cls[x]||'as'}">${esc(x)}</i>`).join('')}</div></div>`;});
  $('#specRows').innerHTML=h;box.hidden=false;
}
function render(rep){
  $('#vMain .vt').hidden=false;
  // 설계 사양 행(spec_rows)과 같은 내용을 스케치 아래 설계 사양 표(spec_table, 확정 전에 고침)로 보여 주므로 #specBox 는 숨김 (한 화면 유지)
  if(rep.kind==='product') return renderProduct(rep);
  if(rep.kind==='integral') return renderIntegral(rep);
  return renderTemplate(rep);
}
// ---------- 영상 모드 (?video=1): 예시 목록 숨김. 1 · 2 · 3 키 = 폰 거치대 · TV 스탠드 · AI 글래스를 실제로 치고 그리는 모습
// (&auto=1 이면 이어서 설계 사양 → 확정 → 1차 설계까지 자동). 콘솔에서 playDemo(0) 도 됨
const QS=new URLSearchParams(location.search);
if(QS.has('video'))$('#example').style.display='none';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(r));
// 시간 기준으로 진행 (느린 PC 에서도 같은 길이): 글자 = 정해 둔 시각에, 획 = 6 초 동안 점을 차례로 이어 그림 (새 조각만 그림)
async function playDemo(i,auto=QS.has('auto')){
  const d=S.demos[i];if(!d||S.playing)return;S.playing=true;
  $('#mSketch').onclick();S.strokes=[];S.labels=[];S.bgImg=null;redraw();
  const ta=$('#text');ta.value='';ta.focus();
  const at=[];let tt=0;for(const ch of d.prompt){tt+=ch===' '?35:/[.,]/.test(ch)?240:45+((ch.charCodeAt(0)*37)%40);at.push(tt);}
  let t0=performance.now(),n=0;
  while(n<at.length){await frame();const e=performance.now()-t0;while(n<at.length&&at[n]<=e)n++;ta.value=d.prompt.slice(0,n);ta.scrollTop=ta.scrollHeight;}
  inputChanged();ta.blur();await sleep(450);
  const P=d.sketch.strokes.reduce((a,s)=>a+s.p.length,0),D=6000;
  let si=0,pi=0,done=0;t0=performance.now();
  ctx.lineCap='round';ctx.lineJoin='round';
  while(si<d.sketch.strokes.length){
    await frame();const goal=Math.min(P,Math.round((performance.now()-t0)/D*P));
    while(done<goal&&si<d.sketch.strokes.length){
      const s=d.sketch.strokes[si];
      if(pi===0)S.strokes.push(Object.assign([],{c:s.c,w:s.w}));
      const cur=S.strokes[S.strokes.length-1],k=Math.min(s.p.length,pi+(goal-done));
      ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.beginPath();const a=pi?s.p[pi-1]:s.p[0];ctx.moveTo(a[0],a[1]);
      for(let q=pi;q<k;q++){cur.push(s.p[q].slice());ctx.lineTo(s.p[q][0],s.p[q][1]);}
      ctx.stroke();done+=k-pi;pi=k;if(pi>=s.p.length){si++;pi=0;}
    }
    $('#padHint').hidden=true;
  }
  for(const L of d.sketch.labels){const l={...L,t:''};S.labels.push(l);for(const ch of L.t){l.t+=ch;redraw();await sleep(150);}}
  S.labelsLast=true;inputChanged();S.playing=false;
  if(auto){await sleep(800);await makeSpec(false);await sleep(2800);$('#bConfirm').click();await sleep(1000);run();}
}
window.playDemo=playDemo;
document.addEventListener('keydown',e=>{if(!QS.has('video')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const i='123'.indexOf(e.key);if(i>=0)playDemo(i);});
</script>
