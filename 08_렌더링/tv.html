<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script src="three.min.js"></script><script src="RoomEnvironment.js"></script><script src="RoundedBoxGeometry.js"></script></head><body><script>
const W=1600,H=1000;const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(W,H);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.7;renderer.setClearColor(0xffffff,1);
document.body.appendChild(renderer.domElement);THREE.Object3D.DefaultUp.set(0,0,1);
const scene=new THREE.Scene();const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(30,W/H,5,30000);cam.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a9399,0.2));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(1200,-2200,3000);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-1500,right:1500,top:1500,bottom:-1500,near:100,far:8000});sun.shadow.bias=-0.0004;scene.add(sun);
const M=(c,r=0.5,m=0.0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,side:THREE.DoubleSide});
// console (TV cabinet top): light oak slab
const cab=new THREE.Mesh(new THREE.RoundedBoxGeometry(2200,520,60,4,8),M(0x8a6440,0.65,0));cab.position.set(0,60,-30);cab.receiveShadow=true;scene.add(cab);
const floorS=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000),new THREE.ShadowMaterial({opacity:0.15}));floorS.position.z=-61;floorS.receiveShadow=true;scene.add(floorS);
const ZB=120; const tv=new THREE.Group();scene.add(tv);
const panel=new THREE.Mesh(new THREE.RoundedBoxGeometry(1451.7,12,832.2,4,3),new THREE.MeshPhysicalMaterial({color:0x1a1c20,roughness:0.35,metalness:0.6}));panel.position.set(0,-6,ZB+416.1);panel.castShadow=true;tv.add(panel);
const back=new THREE.Mesh(new THREE.RoundedBoxGeometry(1300,14,600,4,6),M(0x24272c,0.5,0.2));back.position.set(0,6,ZB+300);back.castShadow=true;tv.add(back);
const cv=document.createElement('canvas');cv.width=1600;cv.height=920;const cx=cv.getContext('2d');
let g=cx.createLinearGradient(0,0,0,920);g.addColorStop(0,'#f7b267');g.addColorStop(0.45,'#f4845f');g.addColorStop(0.7,'#5b4b8a');g.addColorStop(1,'#1d2b53');cx.fillStyle=g;cx.fillRect(0,0,1600,920);
cx.fillStyle='rgba(255,236,200,0.9)';cx.beginPath();cx.arc(1050,470,90,0,7);cx.fill();
const layer=(y,a,col)=>{cx.fillStyle=col;cx.beginPath();cx.moveTo(0,920);for(let x=0;x<=1600;x+=40)cx.lineTo(x,y+a*Math.sin(x/160+y)+a*0.5*Math.sin(x/53));cx.lineTo(1600,920);cx.fill();};
layer(560,40,'#3c3a6e');layer(650,35,'#2a2c55');layer(760,30,'#18203e');
const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;
const scr=new THREE.Mesh(new THREE.PlaneGeometry(1440,820),new THREE.MeshPhysicalMaterial({map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:0.55,roughness:0.08,clearcoat:1}));scr.rotation.x=Math.PI/2;scr.position.set(0,-12.2,ZB+416.1);tv.add(scr);
const dec=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Float32Array(u.buffer);};
const parts={};
const alMat=new THREE.MeshStandardMaterial({color:0xaeb6bd,roughness:0.3,metalness:0.9,side:THREE.DoubleSide});
const sMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.6,metalness:0,envMapIntensity:0.4,side:THREE.DoubleSide});
fetch('meshes_tv.json').then(r=>r.json()).then(J=>{for(const k in J){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(dec(J[k].pos),3));if(J[k].col)g.setAttribute('color',new THREE.BufferAttribute(dec(J[k].col),3));g.computeVertexNormals();
 const grp=new THREE.Group();for(const sx of [-600,600]){const m=new THREE.Mesh(g,J[k].col?sMat:alMat);m.position.x=sx;m.castShadow=true;m.receiveShadow=true;grp.add(m);} grp.visible=false;scene.add(grp);parts[k]=grp;}window.ready=true;});
window.show=function(list,tvOn){for(const p in parts)parts[p].visible=list.includes(p);tv.visible=tvOn;};
window.view=function(p,t,fov){cam.fov=fov||30;cam.position.set(...p);cam.lookAt(...t);cam.updateProjectionMatrix();renderer.render(scene,cam);};
</script></body></html>
